        <h1>花上的甲虫</h1>
        <p>花瓣上的甲虫</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="花瓣上的甲虫" src="../../images/organs-flowers-flower-beetles.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:Japanese_Beetles_Popilia_japonica_1837.jpg">照片来源</a> · ImagePerson · <a href="https://creativecommons.org/licenses/by/4.0">CC BY 4.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察是否能看到甲虫正在取食花瓣，记录其形状及出现的时段。</p>
        <h2>可能原因与下一步</h2>
        <p>花上的访客也可能只是取食花粉。确认受害花和虫体同时出现，再针对害虫采取措施。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>观察有硬翅鞘的甲虫是否正在啃食；停在花上的甲虫也可能只是在采食花粉。</p>
        <h2>现在可以做什么</h2>
        <p>检查新鲜咬痕和相邻叶背，记录受损的是花瓣还是新叶也有缺刻。</p>
        <h2>接下来观察什么</h2>
        <p>用照片对比下一批新叶；若花苞接连打不开，同时拍下虫体与咬痕，供鉴定。</p>
        <!-- /expanded guide -->
