        <h1>果干枯</h1>
        <p>果实干枯</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="果实干枯" src="../../images/diagram-fruit-dry.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察果柄和相邻枝叶是否也失水，以及果实先变软还是先皱缩。</p>
        <h2>可能原因与下一步</h2>
        <p>损伤枝条或供水不稳均可能使果实皱缩。检查枝干和土壤，及时移走已干腐的果实。</p>
