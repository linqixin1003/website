        <h1>叶畸形</h1>
        <p>叶形不规则</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶形不规则" src="../../images/leaf-b-misshapen-leaf.webp">

        <h2>先看哪里</h2>
        <p>记录畸形是否只在一个生长点，并观察尚未展开的新叶有无虫体。</p>
        <h2>可能原因与下一步</h2>
        <p>嫩叶展开时受到损伤即可变形。检查虫害、机械阻碍及近期喷施记录。</p>
