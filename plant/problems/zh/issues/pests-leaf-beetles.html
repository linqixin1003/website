        <h1>叶甲</h1>
        <p>叶面有椭圆形甲虫和咬孔</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶面有椭圆形甲虫和咬孔" src="../../images/beetle-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/205208625">照片来源</a> · (c) georges3, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>拍下甲虫翅鞘、体形和它正在取食的位置。</p>
        <h2>可能原因与下一步</h2>
        <p>甲虫种类繁多，也有捕食害虫的种类。确认取食行为和寄主后再处理。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>观察有硬翅鞘的甲虫是否正在啃食；停在花上的甲虫也可能只是在采食花粉。</p>
        <h2>现在可以做什么</h2>
        <p>检查新鲜咬痕和相邻叶背，记录受损的是花瓣还是新叶也有缺刻。</p>
        <h2>接下来观察什么</h2>
        <p>用照片对比下一批新叶；若花苞接连打不开，同时拍下虫体与咬痕，供鉴定。</p>
        <!-- /expanded guide -->
