        <h1>湿度不足</h1>
        <p>叶片边缘卷曲</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶片边缘卷曲" src="../../images/diagram-curled.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察卷曲方向，比较中午和傍晚的叶形，并检查土壤干湿。</p>
        <h2>可能原因与下一步</h2>
        <p>热、干风和取食损伤都可能使叶缘卷曲。确认诱因后调整光照、水分或虫害管理。</p>
