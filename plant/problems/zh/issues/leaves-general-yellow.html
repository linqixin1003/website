        <h1>缺肥</h1>
        <p>多处叶片同时变黄</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="多处叶片同时变黄" src="../../images/leaf-a-general-yellow.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:Phaseolus_vulgaris_nitrogen_deficiency.jpg">照片来源</a> · Rasbak · <a href="https://creativecommons.org/licenses/by-sa/3.0">CC BY-SA 3.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>记录先发黄的是新叶还是老叶，是否整株都处在相同光照中。</p>
        <h2>可能原因与下一步</h2>
        <p>水分、光照及营养都会影响叶色。先检查近期环境变化与根系，再决定是否施肥。</p>
