        <h1>冠瘿</h1>
        <p>茎上有深色异常增生</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="茎上有深色异常增生" src="../../images/stems-stem-galls.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/45493351">照片来源</a> · (c) Dr. Nasser Halaweh, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>记录增生位于根颈、枝条还是伤口附近，观察表面是否粗糙。</p>
        <h2>可能原因与下一步</h2>
        <p>伤口愈合组织和瘿瘤可能相似。避免切开未知增生，结合植物种类与专业诊断判断。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>组织形成的膨大不会轻易脱落。注意区别正常芽、嫁接口，以及某些豆科植物正常的根瘤。</p>
        <h2>现在可以做什么</h2>
        <p>先原位拍照并标出位置。不要仅为查看而切开主茎或反复翻动根系。</p>
        <h2>接下来观察什么</h2>
        <p>若植株长势减弱，或根颈周围膨大持续增大，应寻求鉴定，并提供全株照片作参照。</p>
        <!-- /expanded guide -->
