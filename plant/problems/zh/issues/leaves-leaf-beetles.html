        <h1>叶甲</h1>
        <p>叶面有椭圆形甲虫和咬孔</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶面有椭圆形甲虫和咬孔" src="../../images/beetle-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/766915459">照片来源</a> · (c) Norman Kuring, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>拍下甲虫翅鞘、体形和它正在取食的位置。</p>
        <h2>可能原因与下一步</h2>
        <p>甲虫种类繁多，也有捕食害虫的种类。确认取食行为和寄主后再处理。</p>
