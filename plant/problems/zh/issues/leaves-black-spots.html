        <h1>黑斑病</h1>
        <p>叶片上出现黑色斑块</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶片上出现黑色斑块" src="../../images/black-spot-nat.webp">
          <figcaption>参考照片 · <a href="https://www.inaturalist.org/photos/763792509">Diplocarpon rosae</a> · (c) Kyle Campbell, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已缩放并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>查看黑色病斑是否长在叶组织内、周围是否发黄，并检查较低叶片有无提前脱落。</p>
        <h2>可能原因与下一步</h2>
        <p>玫瑰黑斑病可形成深色病斑并使叶片脱落；能擦去的黑层则可能是煤污。清理病落叶，从根部浇水，给叶丛留出通风空间。</p>
