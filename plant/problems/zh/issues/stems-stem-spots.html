        <h1>褐斑病</h1>
        <p>茎上出现褐色的斑点</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="茎上出现褐色的斑点" src="../../images/stems-stem-spots.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:Late_blight_on_tomato_stem_%287871757900%29.jpg">照片来源</a> · Dwight Sipler · <a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>拍下斑点边缘，看表皮是平整、木栓化，还是凹陷开裂。</p>
        <h2>可能原因与下一步</h2>
        <p>老茎木栓化、擦伤和病斑可能相似。标记一处斑点，观察是否向新枝扩展。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>比较病斑边缘与健康组织。若只有一处、恰好接触绑带或邻叶，可能是擦伤；多处新斑则要仔细检查。</p>
        <h2>现在可以做什么</h2>
        <p>在旁边放尺拍照留存，并直接往土面浇水，让枝叶表面在两次浇水之间干燥。</p>
        <h2>接下来观察什么</h2>
        <p>若斑块扩大或新梢也长斑，保留全株、受损部位正反面照片供诊断。</p>
        <!-- /expanded guide -->
