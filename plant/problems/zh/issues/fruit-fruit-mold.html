        <h1>果发霉</h1>
        <p>果皮出现霉层</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="果皮出现霉层" src="../../images/diagram-fruit-mold.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>查看霉层下的组织是否软化，果实间是否拥挤或有碰伤。</p>
        <h2>可能原因与下一步</h2>
        <p>腐败果可能影响相邻果。移除受害果，改善周围通风，检查下一批果实。</p>
