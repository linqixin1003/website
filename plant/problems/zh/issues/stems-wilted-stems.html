      <article class="article">
        <h1>萎蔫</h1>
        <p>茎萎蔫</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="茎萎蔫" src="../../images/organs-flowers-wilted-flowers.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:Wilting_tulip.jpg">照片来源</a> · LiteralDeath · <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>检查下垂的茎是否还有弹性，茎基是否折伤，以及根团内部的干湿。</p>
        <h2>可能原因与下一步</h2>
        <p>土太干或根部积水都会影响输水。根据实测湿度调整浇水，记录是否出现新的萎蔫枝条。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>比较清晨和午后高温时的状态，并检查根团是干、湿，还是仅边缘潮湿。</p>
        <h2>现在可以做什么</h2>
        <p>若根团干燥，均匀补水；若已湿润，则让多余水分排出。刚移栽的植株可先避开干风，再排查根系。</p>
        <h2>接下来观察什么</h2>
        <p>夜间恢复提示短时失水超过了供水。若只有一根枝梢持续倒伏，应检查该枝基部。</p>
        <!-- /expanded guide -->
