        <h1>缺水</h1>
        <p>干土中的下叶发黄并萎蔫</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="干土中的下叶发黄并萎蔫" src="../../images/diagram-wilt.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>检查根团中部，水是否沿盆壁迅速流走而未湿润中心。</p>
        <h2>可能原因与下一步</h2>
        <p>根团确实干透时缓慢浇水至湿透，让多余水排走。观察嫩叶是否恢复挺立。</p>
