        <h1>白粉病</h1>
        <p>可擦去的白色粉层</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="可擦去的白色粉层" src="../../images/leaf-b-white-coating.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/766039240">照片来源</a> · (c) Vasco Henrique Oliveira Fonseca, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察粉层是否呈不规则斑块，是否同时覆盖叶、嫩茎或果面。</p>
        <h2>可能原因与下一步</h2>
        <p>白粉病及表面残留物都有可能。记录是否再次出现，留足通风空间，结合寄主鉴别。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>天然果粉或蜡层往往较均匀；粉状病斑则常呈不规则块，并可能扩大或出现在新组织上。</p>
        <h2>现在可以做什么</h2>
        <p>对照同株健康与受损部位；触碰前先拍下覆盖层，保留健康果实上的天然果粉。</p>
        <h2>接下来观察什么</h2>
        <p>若新粉斑扩展到嫩梢或叶片，结合植物种类进一步判断是否需要处理。</p>
        <!-- /expanded guide -->
