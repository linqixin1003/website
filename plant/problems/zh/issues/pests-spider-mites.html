        <h1>害虫-叶螨</h1>
        <p>叶背有细小螨和细丝</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶背有细小螨和细丝" src="../../images/spider-mite-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/1696964">照片来源</a> · (c) Gilles San Martin, some rights reserved (CC BY-SA) · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察叶背是否有细丝、活动的小点和叶面失绿斑。</p>
        <h2>可能原因与下一步</h2>
        <p>螨类取食可造成细碎失绿。用清水冲洗适合水洗的叶面，隔开受害盆栽以便复查。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>单凭褪色小点不能确定叶螨。翻看叶背是否有活动小点与细密丝网，普通蜘蛛网通常更粗。</p>
        <h2>现在可以做什么</h2>
        <p>在白纸上方轻拍可疑叶片，用放大镜观察落下的小点是否移动；耐冲洗的植物可轻洗叶背。</p>
        <h2>接下来观察什么</h2>
        <p>复查邻近叶片有无新失绿点；原有斑点通常不会在虫害控制后消失。</p>
        <!-- /expanded guide -->
