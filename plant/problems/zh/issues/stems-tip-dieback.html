        <h1>枯梢</h1>
        <p>枝条从顶端开始干枯</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="枝条从顶端开始干枯" src="../../images/diagram-tip-dieback.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>比较向风和背风面的新梢，查看顶芽是否发褐及下部枝条是否仍有活芽。</p>
        <h2>可能原因与下一步</h2>
        <p>霜冻、干风或枝梢感染都可能损伤顶部。记录近期天气；待活芽界限清晰后再决定修剪位置。</p>
