        <h1>果腐烂</h1>
        <p>果实变软腐烂</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="果实变软腐烂" src="../../images/fruit-rot-nat.webp">
          <figcaption>参考照片 · <a href="https://www.inaturalist.org/photos/326326561">Monilinia fructigena</a> · (c) Martin Hünlich, some rights reserved (CC BY-SA), uploaded by Martin Hünlich · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA</a> · 已缩放并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>检查软化是否从裂口、果柄或接触地面处开始。</p>
        <h2>可能原因与下一步</h2>
        <p>伤口和长时间潮湿会增加腐坏机会。移走明显腐败果，保持健康果清洁通风。</p>
