        <h1>毛毛虫</h1>
        <p>花瓣上有毛虫或咬痕</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="花瓣上有毛虫或咬痕" src="../../images/organs-flowers-caterpillars.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:Caterpillar_on_pink_flower_(5359535899).jpg">照片来源</a> · John Tann from Sydney, Australia · <a href="https://creativecommons.org/licenses/by/2.0">CC BY 2.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>检查花瓣背后和花蕾内侧是否有幼虫、较大的咬孔或颗粒状虫粪。</p>
        <h2>可能原因与下一步</h2>
        <p>若看见幼虫正在啃食花瓣，可连同受损花一起拍照鉴别。少量咬痕也可能来自其他昆虫，保留未受害的花。</p>
