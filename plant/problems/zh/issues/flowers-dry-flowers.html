        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>

        <h2>先看哪里</h2>
        <p>枯萎是否只发生在已经开放很久的花？看花蕾及同一枝条的叶片是否健康。</p>
        <h2>可能原因与下一步</h2>
        <p>老花干枯属于常见变化。若新蕾也枯，检查根团是否过干，以及花是否靠近热风口。</p>
