        <h2>先看哪里</h2>
        <p>查看根是沿盆壁打圈、碰到硬物后分叉，还是根组织本身出现结节。拍照时放一把尺作参照。</p>
        <h2>可能原因与下一步</h2>
        <p>拥挤和地下害虫都可能改变根形。先确认容器空间和介质状态；若有许多不规则根瘤，请园艺机构结合植物种类鉴别。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>组织形成的膨大不会轻易脱落。注意区别正常芽、嫁接口，以及某些豆科植物正常的根瘤。</p>
        <h2>现在可以做什么</h2>
        <p>先原位拍照并标出位置。不要仅为查看而切开主茎或反复翻动根系。</p>
        <h2>接下来观察什么</h2>
        <p>若植株长势减弱，或根颈周围膨大持续增大，应寻求鉴定，并提供全株照片作参照。</p>
