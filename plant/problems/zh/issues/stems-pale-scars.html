        <h1>疤痕</h1>
        <p>没有扩大的浅色斑纹</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="没有扩大的浅色斑纹" src="../../images/stem-scar-kawakawa.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:Branch_scar_on_kawakawa_trunk_(Macropiper_excelsum).jpg">照片来源</a> · Avenue · <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>在斑痕旁放一把尺拍照，观察树皮是否已在伤口周围愈合，并对比边缘是否继续扩大。</p>
        <h2>可能原因与下一步</h2>
        <p>枝条摩擦、绑带过紧或旧剪口都可能留下浅色疤痕。解除摩擦或勒压；如果斑痕扩大或新梢萎蔫，再排查持续损伤。</p>
