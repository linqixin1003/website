        <h1>叶象甲</h1>
        <p>带长吻的甲虫和叶缘缺刻</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="带长吻的甲虫和叶缘缺刻" src="../../images/weevil-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/762179014">照片来源</a> · (c) Hannah Hickli, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察叶缘是否有半圆形缺刻，夜间看看植株上是否出现长吻甲虫。</p>
        <h2>可能原因与下一步</h2>
        <p>象甲成虫可取食叶缘。若同时出现整株萎蔫，还要检查根部是否受损。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>叶缘连续的缺刻提示有虫啃食；成虫头部向前伸出的喙有助于与其他甲虫区分。</p>
        <h2>现在可以做什么</h2>
        <p>入夜后用手电检查枝叶和盆沿，尤其留意新缺刻附近，拍下虫体。</p>
        <h2>接下来观察什么</h2>
        <p>若盆土湿润植株仍萎蔫，检查根团是否也受损；少量叶缘缺刻未必能解释整株萎蔫。</p>
        <!-- /expanded guide -->
