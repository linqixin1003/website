        <h1>叶斑病</h1>
        <p>散在的黄白色斑点</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="散在的黄白色斑点" src="../../images/diagram-pale-spot.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>比较斑点与日晒方向、喷溅位置的关系，检查叶背虫迹。</p>
        <h2>可能原因与下一步</h2>
        <p>局部漂白可来自强光、喷液或取食。回顾新近搬动和叶面处理，先去除明显诱因。</p>
