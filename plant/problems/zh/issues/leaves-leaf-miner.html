        <h1>害虫-潜叶虫</h1>
        <p>浅色弯曲的潜道</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="浅色弯曲的潜道" src="../../images/leaf-a-leaf-miner.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/580909218">照片来源</a> · (c) Ben Jobson, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>迎光查看弯曲痕迹是否夹在两层表皮之间，并看末端是否变宽。</p>
        <h2>可能原因与下一步</h2>
        <p>潜叶昆虫可形成这种取食通道。观察是否持续出现新潜道，少量受害通常可保留叶片。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>潜道位于叶片内部，常沿着弯曲路线逐渐变宽；表皮擦痕没有封闭的隧道。</p>
        <h2>现在可以做什么</h2>
        <p>把叶片举到光前，查看潜道宽端有无幼虫或深色痕迹。摘除受害叶时保留足够健康叶。</p>
        <h2>接下来观察什么</h2>
        <p>空潜道不会消失；观察刚展开的新叶有无细小的新潜道，判断是否还有活动。</p>
        <!-- /expanded guide -->
