        <h1>褐斑病</h1>
        <p>叶片上出现细密褐点</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶片上出现细密褐点" src="../../images/diagram-speckled-brown.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>用放大镜看叶背，观察细点能否擦去，并检查叶脉附近有无活动的小虫。</p>
        <h2>可能原因与下一步</h2>
        <p>细点可能来自取食、残留物或组织坏死。记录点的位置及叶背状况后再选择处理方式。</p>
