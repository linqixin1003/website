        <h1>黑煤灰点</h1>
        <p>叶面有可擦去的黑层</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶面有可擦去的黑层" src="../../images/leaf-b-sooty-mold.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/664818496">照片来源</a> · (c) Matthias Blume, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>擦拭一小块叶面，检查上方枝叶是否发黏或有介壳虫。</p>
        <h2>可能原因与下一步</h2>
        <p>煤污常生长在蜜露上。查找产生蜜露的昆虫后再处理，清水轻擦耐洗叶片。</p>
