        <h1>缩叶病</h1>
        <p>新叶扭曲，局部发红</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="新叶扭曲，局部发红" src="../../images/diagram-red-curl.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>检查多个枝尖的嫩叶，观察红色是正常新叶色还是伴随增厚起泡。</p>
        <h2>可能原因与下一步</h2>
        <p>某些病虫害会影响展开中的叶片。结合树种、季节及当地天气判断。</p>
