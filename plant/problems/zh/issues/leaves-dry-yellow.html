        <h1>缺水</h1>
        <p>干土中的下叶发黄并萎蔫</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="干土中的下叶发黄并萎蔫" src="../../images/leaf-a-dry-yellow.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/741338268">照片来源</a> · (c) Ruth Palsson, some rights reserved (CC BY-SA) · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <p>照片用于对照黄叶外观。请结合盆土湿度判断原因。</p>
        <h2>先看哪里</h2>
        <p>检查根团中部，水是否沿盆壁迅速流走而未湿润中心。</p>
        <h2>可能原因与下一步</h2>
        <p>根团确实干透时缓慢浇水至湿透，让多余水排走。观察嫩叶是否恢复挺立。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>表土干燥时盆心仍可能很湿。先检查根层湿度，再掂一掂盆重后决定是否浇水。</p>
        <h2>现在可以做什么</h2>
        <p>根团干透时均匀润湿并充分沥水；若根团湿，先倒掉积水，检查排水孔。</p>
        <h2>接下来观察什么</h2>
        <p>观察枝叶能否恢复挺立，以及新生长是否健康。湿土中仍萎蔫时先检查根团。</p>
        <!-- /expanded guide -->
