        <h1>正常枯黄</h1>
        <p>少量下叶干枯</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="少量下叶干枯" src="../../images/diagram-dry-base.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>比较枯叶与最近长出的叶片，看叶柄处是否自然干脱。</p>
        <h2>可能原因与下一步</h2>
        <p>健康植株会逐步更新老叶。若枯叶数量增加，重新检查根团水分和光照。</p>
