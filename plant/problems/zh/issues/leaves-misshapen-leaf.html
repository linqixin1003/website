        <h1>叶畸形</h1>
        <p>叶形不规则</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶形不规则" src="../../images/leaf-b-misshapen-leaf.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/752103438">照片来源</a> · (c) Eric Schmidt, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>记录畸形是否只在一个生长点，并观察尚未展开的新叶有无虫体。</p>
        <h2>可能原因与下一步</h2>
        <p>嫩叶展开时受到损伤即可变形。检查虫害、机械阻碍及近期喷施记录。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>嫩叶展开时可能因取食、受寒或病害而畸形。查看连续几片新叶是否都异常，以及有无红色隆起。</p>
        <h2>现在可以做什么</h2>
        <p>轻查折叠叶缘有无虫体，不要强行拉平；记录植物种类、萌芽时间和近期是否降温。</p>
        <h2>接下来观察什么</h2>
        <p>已卷曲的叶通常不会变平；若新梢也畸形，保留带一段嫩枝的新鲜样本。</p>
        <!-- /expanded guide -->
