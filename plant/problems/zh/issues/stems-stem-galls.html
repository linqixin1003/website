        <h1>冠瘿</h1>
        <p>茎上有深色异常增生</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="茎上有深色异常增生" src="../../images/stems-stem-galls.webp">

        <h2>先看哪里</h2>
        <p>记录增生位于根颈、枝条还是伤口附近，观察表面是否粗糙。</p>
        <h2>可能原因与下一步</h2>
        <p>伤口愈合组织和瘿瘤可能相似。避免切开未知增生，结合植物种类与专业诊断判断。</p>
