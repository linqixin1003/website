        <h1>叶象甲</h1>
        <p>带长吻的甲虫和叶缘缺刻</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="带长吻的甲虫和叶缘缺刻" src="../../images/weevil-nat.webp">
          <figcaption>参考照片 · <a href="https://www.inaturalist.org/photos/762179014">Otiorhynchus sulcatus</a> · (c) Hannah Hickli, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已缩放并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察叶缘是否有半圆形缺刻，夜间看看植株上是否出现长吻甲虫。</p>
        <h2>可能原因与下一步</h2>
        <p>象甲成虫可取食叶缘。若同时出现整株萎蔫，还要检查根部是否受损。</p>
