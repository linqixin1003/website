      <article class="article">
        <h1>正常枯黄</h1>
        <p>少量下叶干枯</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="少量下叶干枯" src="../../images/leaf-b-dry-older-leaves.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/764157495">照片来源</a> · (c) Maura, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>比较枯叶与最近长出的叶片，看叶柄处是否自然干脱。</p>
        <h2>可能原因与下一步</h2>
        <p>健康植株会逐步更新老叶。若枯叶数量增加，重新检查根团水分和光照。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>偶尔脱落最老的叶片可能正常，应比较嫩叶状态，并确认是否整枝都受影响。</p>
        <h2>现在可以做什么</h2>
        <p>只清除已完全枯萎且容易脱落的叶片；若掉叶加速，回顾是否刚改变光照、浇水或摆放位置。</p>
        <h2>接下来观察什么</h2>
        <p>若嫩叶也发黄，或整枝突然变色，应重新检查根层水分和根系健康。</p>
        <!-- /expanded guide -->
