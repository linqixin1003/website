        <h1>叶枯病</h1>
        <p>叶片从叶尖开始变褐干枯</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶片从叶尖开始变褐干枯" src="../../images/leaf-a-brown-tips.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/642928744">照片来源</a> · (c) Jay Brasher, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察尖端是否干脆、边缘是否逐渐变宽，同时查看盆沿有无白色盐渍。</p>
        <h2>可能原因与下一步</h2>
        <p>水分供应波动和盐分积累都可能伤害叶尖。检查浇水及施肥记录，用新叶判断调整是否有效。</p>
