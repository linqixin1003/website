        <h1>褐斑病</h1>
        <p>叶片上出现褐色的斑块</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶片上出现褐色的斑块" src="../../images/brown-spot-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/573277169">照片来源</a> · (c) Jerzy Opioła, some rights reserved (CC BY-SA) · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>比较朝窗与背窗的叶片；记录损伤在叶缘、叶脉之间还是散布叶面。</p>
        <h2>可能原因与下一步</h2>
        <p>日灼、失水和叶斑病都可能留下褐块。回顾近期光照变化，拍下健康新叶以便比较。</p>
