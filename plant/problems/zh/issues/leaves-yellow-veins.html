      <article class="article">
        <h1>叶脉发黄</h1>
        <p>叶脉变黄，叶肉仍绿</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶脉变黄，叶肉仍绿" src="../../images/leaf-a-yellow-veins.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/498805837">照片来源</a> · (c) Hannes Dahm, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>比较多片新旧叶，观察变色是否严格沿叶脉，并记录叶形变化。</p>
        <h2>可能原因与下一步</h2>
        <p>叶脉变色的原因需要结合寄主判断。先记录发展情况，若持续蔓延，向植物诊疗机构咨询。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>观察嫩叶，分清是叶脉本身发黄还是脉间发黄；两者的排查方向可能不同。</p>
        <h2>现在可以做什么</h2>
        <p>在自然光下比较同龄叶。补充某一种元素前，先看根系状态并检查土壤酸碱度。</p>
        <h2>接下来观察什么</h2>
        <p>新叶若持续表现相同，保留新老叶的对照照片，根据植物种类考虑土壤或叶片检测。</p>
