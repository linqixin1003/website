        <h1>瘿</h1>
        <p>叶片有突起或瘿瘤</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶片有突起或瘿瘤" src="../../images/diagram-gall.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察突起是否来自叶组织本身，在叶片另一侧是否也能看到对应形状。</p>
        <h2>可能原因与下一步</h2>
        <p>虫螨等刺激可引起虫瘿；不同寄主的瘿形各异。记录寄主及新叶变化再鉴别。</p>
