        <h1>炭疽病</h1>
        <p>灰斑带深色边缘</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="灰斑带深色边缘" src="../../images/leaf-a-gray-lesions.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/328799536">照片来源</a> · (c) Henry Van T. Cotter, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>比较斑点中央与边缘的颜色，看多个斑是否逐渐相连。</p>
        <h2>可能原因与下一步</h2>
        <p>多种叶斑有这种外观。浇水时减少溅水，留存病斑变化照片用于鉴别。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>多种叶斑都有深边浅心，检查中心是否凹陷，并记录斑块与叶脉的关系。</p>
        <h2>现在可以做什么</h2>
        <p>避免在枝叶潮湿时翻动植株，先看茎和果实有无类似凹斑，再清理严重受损叶片。</p>
        <h2>接下来观察什么</h2>
        <p>若嫩梢或果实也出现病斑，送交鉴定的照片中应包含这些部位。</p>
        <!-- /expanded guide -->
