        <h1>害虫-潜叶虫</h1>
        <p>浅色弯曲的潜道</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="浅色弯曲的潜道" src="../../images/diagram-leaf-miner.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>迎光查看弯曲痕迹是否夹在两层表皮之间，并看末端是否变宽。</p>
        <h2>可能原因与下一步</h2>
        <p>潜叶昆虫可形成这种取食通道。观察是否持续出现新潜道，少量受害通常可保留叶片。</p>
