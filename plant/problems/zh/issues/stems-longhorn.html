        <h1>害虫-天牛</h1>
        <p>长触角甲虫与枝干孔洞</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="长触角甲虫与枝干孔洞" src="../../images/longhorn-beetle-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/713022320">照片来源</a> · (c) Timur Kalininsky, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>查看枝干是否同时有圆孔、碎屑和衰弱枝，单只成虫停留不能确认木内有幼虫。</p>
        <h2>可能原因与下一步</h2>
        <p>请当地树木专家鉴别寄主与孔洞，避免搬运来源不明的受害木料。</p>
