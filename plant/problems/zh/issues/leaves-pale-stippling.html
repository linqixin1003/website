        <h1>吸食汁液害虫</h1>
        <p>叶面密布黄白色针点</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶面密布黄白色针点" src="../../images/leaf-a-pale-stippling.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/98477099">照片来源</a> · (c) Steven Bodzin, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>沿主叶脉和叶背寻找活动螨虫、细网或残余虫皮。</p>
        <h2>可能原因与下一步</h2>
        <p>多种刺吸害虫可留下密集细点。用放大镜确认，隔离有虫的盆栽。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>比较向阳叶与遮阴叶。单侧漂白可能与暴晒有关；密集小点伴叶背活虫，更需排查虫害。</p>
        <h2>现在可以做什么</h2>
        <p>检查叶背并拍下斑点分布；不要把长期遮阴的植物突然移入全日照。</p>
        <h2>接下来观察什么</h2>
        <p>复查遮阴叶是否也新增浅斑；若有，记录查到的虫体或附着物。</p>
        <!-- /expanded guide -->
