        <h1>烂根</h1>
        <p>根变软腐烂</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="根变软腐烂" src="../../images/organs-roots-soft-roots.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:Rhododendron-Phytophthora_Root_Rot_(2).jpg">照片来源</a> · Jerzy Opioła · <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>将盆从套盆里取出，看看底部是否积水。轻触可见的根，记录哪些仍有弹性，哪些轻碰就脱皮。</p>
        <h2>可能原因与下一步</h2>
        <p>长期积水会使根缺氧。检查排水孔，倒掉托盘里的水，等盆土达到该植物适宜的干湿程度再浇。</p>
