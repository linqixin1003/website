        <h1>锈病</h1>
        <p>红褐色斑点与粉状小疱</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="红褐色斑点与粉状小疱" src="../../images/rust-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/766061768">照片来源</a> · (c) Jeff Clark, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>翻看叶背有无橙褐色突起，比较叶面同一位置是否褪色。</p>
        <h2>可能原因与下一步</h2>
        <p>锈病是可能原因之一。避免湿叶摩擦，记录寄主并观察新叶是否出现同类小疱。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>翻看斑点背面是否有隆起孢子堆。某些锈病能留下有色粉末，单凭平坦的橙斑还不够。</p>
        <h2>现在可以做什么</h2>
        <p>触碰之前拍下叶片两面；把严重受损的落叶清离健康枝叶。</p>
        <h2>接下来观察什么</h2>
        <p>新叶反复长斑时，记录植物种类和发生季节，这有助于区分不同锈病。</p>
        <!-- /expanded guide -->
