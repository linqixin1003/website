        <h1>水涝</h1>
        <p>湿土中的下叶成片发黄</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="湿土中的下叶成片发黄" src="../../images/diagram-basal-yellow.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>看看表土以下是否持续湿黏、套盆是否积水，同时比较顶部新叶。</p>
        <h2>可能原因与下一步</h2>
        <p>根部缺氧会影响叶色。倒掉积水，在重新浇水前按植物习性检查干湿。</p>
