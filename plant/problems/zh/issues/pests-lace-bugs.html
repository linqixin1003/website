        <h1>害虫-网蝽</h1>
        <p>透明网翅小虫与浅色斑点</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="透明网翅小虫与浅色斑点" src="../../images/lace-bug-nat.webp">
          <figcaption>参考照片 · <a href="https://www.inaturalist.org/photos/512454659">Corythucha ciliata</a> · (c) Saryu Mae 前 朝琉, some rights reserved (CC BY), uploaded by Saryu Mae 前 朝琉 · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已缩放并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察叶背是否有网纹翅膀的小虫和黑色斑点，与叶面浅色小点对照。</p>
        <h2>可能原因与下一步</h2>
        <p>网蝽类常在叶背取食。记录寄主和受害叶龄，保留天敌，并检查下一批叶片。</p>
