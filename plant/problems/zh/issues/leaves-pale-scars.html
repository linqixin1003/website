      <article class="article">
        <h1>疤痕</h1>
        <p>没有扩大的浅色斑纹</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="没有扩大的浅色斑纹" src="../../images/leaf-a-pale-scars.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/587701620">照片来源</a> · <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>拍照记录斑纹并对照新长的叶片，看是否仍只出现在旧叶受光或摩擦的一面。</p>
        <h2>可能原因与下一步</h2>
        <p>稳定的斑纹可能来自旧伤、日灼或自然斑锦。调整明显的摩擦来源，保留正常叶片。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>旧擦伤通常较稳定。若出现新的银色痕迹、虫粪或活动虫体，要考虑仍有取食。</p>
        <h2>现在可以做什么</h2>
        <p>检查支架、绑带或相邻枝条是否摩擦，调整接触位置并给旧痕拍照。</p>
        <h2>接下来观察什么</h2>
        <p>观察调整以后长出的组织；若新生部分完整，原先的接触摩擦可能是主因。</p>
        <!-- /expanded guide -->
