        <h1>光照不足</h1>
        <p>茎细长，叶色变浅</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="茎细长，叶色变浅" src="../../images/leaf-b-leggy.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/749764711">照片来源</a> · meshhy · <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>比较新枝与旧枝的节间距离，看植株是否朝光源倾斜。</p>
        <h2>可能原因与下一步</h2>
        <p>光线不足可使枝条徒长。按植物习性逐渐改善光照，避免突然移到烈日下。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>比较同一枝梢新旧部分相邻叶片的距离。节间拉长并朝窗户倾斜，提示光线可能不足。</p>
        <h2>现在可以做什么</h2>
        <p>逐步移近适宜光源，在新梢长稳前给柔弱枝茎适当支撑。</p>
        <h2>接下来观察什么</h2>
        <p>旧节间不会缩短，应比较后续新叶之间的距离，以及新茎是否更结实。</p>
        <!-- /expanded guide -->
