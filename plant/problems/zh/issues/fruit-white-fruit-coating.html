        <h1>白粉病</h1>
        <p>果面有白色粉状覆盖物</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="果面有白色粉状覆盖物" src="../../images/diagram-mildew.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>留意粉层分布及同株叶片，区分品种天然果粉与新出现的不均匀白斑。</p>
        <h2>可能原因与下一步</h2>
        <p>某些真菌病害也会产生白粉。避免擦伤果皮，记录是否蔓延到叶和新果。</p>
