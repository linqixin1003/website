        <h1>角斑病</h1>
        <p>沿叶脉边界的黄色斑块</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="沿叶脉边界的黄色斑块" src="../../images/leaf-a-angular-yellow.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/147541589">照片来源</a> · (c) Nathan T. Jones, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>翻看斑块背面有无绒层，观察黄色区域的边界是否受叶脉限制。</p>
        <h2>可能原因与下一步</h2>
        <p>部分叶部病害可呈角形。保持叶面干爽，拍摄上下两面并记录寄主。</p>
