      var select = document.getElementById("langSelect");

      function normalize(code) {
        if (!code) return null;
        var lower = String(code).replace("_", "-").toLowerCase();
        if (lower === "zh-tw" || lower === "zh-hant" || lower.indexOf("zh-tw") === 0 || lower.indexOf("zh-hant") === 0) {
          return "zh-TW";
        }
        if (lower === "zh" || lower.indexOf("zh-") === 0) return "zh";
        var base = lower.split("-")[0];
        return I18N[base] ? base : null;
      }

      function fillSelect() {
        select.innerHTML = "";
        LANGS.forEach(function (lang) {
          var opt = document.createElement("option");
          opt.value = lang.code;
          opt.textContent = lang.label;
          select.appendChild(opt);
        });
      }

      function renderList(el, items) {
        el.innerHTML = "";
        items.forEach(function (item) {
          var li = document.createElement("li");
          li.innerHTML = item;
          el.appendChild(li);
        });
      }

      function setLang(lang) {
        if (!I18N[lang]) lang = "en";
        var t = I18N[lang];
        document.documentElement.lang = lang === "zh-TW" ? "zh-Hant" : lang;
        document.title = t.docTitle;
        document.getElementById("title").textContent = t.title;
        document.getElementById("meta").innerHTML = t.meta;
        document.getElementById("howTitle").textContent = t.howTitle;
        renderList(document.getElementById("steps"), t.steps);
        document.getElementById("whatTitle").textContent = t.whatTitle;
        renderList(document.getElementById("whatList"), t.whatList);
        document.getElementById("whatNote").textContent = t.whatNote;
        document.getElementById("accountNote").innerHTML = t.accountNote;
        document.getElementById("helpTitle").textContent = t.helpTitle;
        document.getElementById("helpBody").innerHTML = t.helpBody;
        select.value = lang;
        try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
        if (history.replaceState) {
          var url = new URL(window.location.href);
          if (lang === "en") url.searchParams.delete("lang");
          else url.searchParams.set("lang", lang);
          history.replaceState(null, "", url.pathname + url.search + url.hash);
        }
      }

      fillSelect();
      select.addEventListener("change", function () {
        setLang(select.value);
      });

      var params = new URLSearchParams(window.location.search);
      var fromQuery = normalize(params.get("lang"));
      var fromStorage = null;
      try { fromStorage = normalize(localStorage.getItem(STORAGE_KEY)); } catch (e) {}

      // Default English; query/storage can override to a T1 locale.
      setLang(fromQuery || fromStorage || "en");
    })();
