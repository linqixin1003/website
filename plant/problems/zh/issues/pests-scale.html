        <h1>介壳虫</h1>
        <p>枝叶上有可剥离的小壳</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="枝叶上有可剥离的小壳" src="../../images/scale-insect-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/757014882">照片来源</a> · (c) Grey Smith, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>用放大镜检查叶脉和枝条上的突起，区分虫壳与植物本身的组织。</p>
        <h2>可能原因与下一步</h2>
        <p>介壳虫可附着在枝叶上。隔开受害盆栽，仔细检查旁边的植物。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>用放大镜查看多个凸点。树皮上均匀排列的皮孔可能正常，介壳虫则有独立的虫体轮廓。</p>
        <h2>现在可以做什么</h2>
        <p>检查叶脉、叶柄和枝杈，在结实的枝条上轻挑一个可疑凸点，避免整枝刮伤。</p>
        <h2>接下来观察什么</h2>
        <p>空壳可能长期附着，判断是否仍有虫时要看新梢上有无新出现的虫体。</p>
        <!-- /expanded guide -->
