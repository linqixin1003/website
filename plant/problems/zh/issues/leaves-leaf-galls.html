        <h1>瘿</h1>
        <p>叶片有突起或瘿瘤</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶片有突起或瘿瘤" src="../../images/leaf-b-leaf-galls.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/756508898">照片来源</a> · (c) Nathan Ruchalski, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察突起是否来自叶组织本身，在叶片另一侧是否也能看到对应形状。</p>
        <h2>可能原因与下一步</h2>
        <p>虫螨等刺激可引起虫瘿；不同寄主的瘿形各异。记录寄主及新叶变化再鉴别。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>组织形成的膨大不会轻易脱落。注意区别正常芽、嫁接口，以及某些豆科植物正常的根瘤。</p>
        <h2>现在可以做什么</h2>
        <p>先原位拍照并标出位置。不要仅为查看而切开主茎或反复翻动根系。</p>
        <h2>接下来观察什么</h2>
        <p>若植株长势减弱，或根颈周围膨大持续增大，应寻求鉴定，并提供全株照片作参照。</p>
        <!-- /expanded guide -->
