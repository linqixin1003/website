        <h1>果畸形</h1>
        <p>果实畸形</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="果实畸形" src="../../images/organs-fruit-distorted-fruit.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:Starr-210530-9866-Prunus_persica_var_persica-Florda_Prince_catfacing_irjury_from_piercing_insect-Hawea_Pl_Olinda-Maui_(51579016703).jpg">照片来源</a> · Forest and Kim Starr · <a href="https://creativecommons.org/licenses/by/2.0">CC BY 2.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>看畸形是否集中在果实一侧，同时记录开花期间的天气和叶片变化。</p>
        <h2>可能原因与下一步</h2>
        <p>授粉不均、温度波动和虫害都可能影响发育。对照同株后续果实，结合品种判断。</p>
