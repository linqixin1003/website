        <h1>叶片穿孔</h1>
        <p>褐斑中心脱落成孔</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="褐斑中心脱落成孔" src="../../images/leaf-b-shot-holes.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/763198393">照片来源</a> · Stephen James McWilliam · <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察新旧斑点，看看孔边是否留有一圈褐色组织。</p>
        <h2>可能原因与下一步</h2>
        <p>坏死组织脱落可形成穿孔，和直接啃食不同。收集斑点到穿孔的照片以便鉴别。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>查看孔缘。若有坏死边圈，旁边还有中心未脱落的斑，可能是病斑组织掉落；新鲜撕裂边则也可能来自啃食。</p>
        <h2>现在可以做什么</h2>
        <p>把早期斑点和成熟孔洞一起拍下，决定是否治虫前检查叶背有无虫体。</p>
        <h2>接下来观察什么</h2>
        <p>若花芽、小枝或果实也出现斑痕，应在鉴定时一并提供这些线索。</p>
        <!-- /expanded guide -->
