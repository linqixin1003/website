        <h1>褐斑病</h1>
        <p>茎上出现褐色的斑点</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="茎上出现褐色的斑点" src="../../images/diagram-stem-spots.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>拍下斑点边缘，看表皮是平整、木栓化，还是凹陷开裂。</p>
        <h2>可能原因与下一步</h2>
        <p>老茎木栓化、擦伤和病斑可能相似。标记一处斑点，观察是否向新枝扩展。</p>
