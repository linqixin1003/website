        <h1>湿度不足</h1>
        <p>叶片边缘卷曲</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶片边缘卷曲" src="../../images/leaf-b-curled-edges.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:Rhododendron_teplo_a_sucho.JPG">照片来源</a> · I.Sáček, senior · <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察卷曲方向，比较中午和傍晚的叶形，并检查土壤干湿。</p>
        <h2>可能原因与下一步</h2>
        <p>热、干风和取食损伤都可能使叶缘卷曲。确认诱因后调整光照、水分或虫害管理。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>比较清晨和午后高温时的状态，并检查根团是干、湿，还是仅边缘潮湿。</p>
        <h2>现在可以做什么</h2>
        <p>若根团干燥，均匀补水；若已湿润，则让多余水分排出。刚移栽的植株可先避开干风，再排查根系。</p>
        <h2>接下来观察什么</h2>
        <p>夜间恢复提示短时失水超过了供水。若只有一根枝梢持续倒伏，应检查该枝基部。</p>
        <!-- /expanded guide -->
