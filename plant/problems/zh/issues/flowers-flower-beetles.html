        <h1>叶甲</h1>
        <p>花瓣上的甲虫</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="花瓣上的甲虫" src="../../images/beetle-nat.webp">
          <figcaption>参考照片 · <a href="https://www.inaturalist.org/photos/766915459">Popillia japonica</a> · (c) Norman Kuring, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已缩放并转为 WebP</figcaption>

        <h2>先看哪里</h2>
        <p>观察是否能看到甲虫正在取食花瓣，记录其形状及出现的时段。</p>
        <h2>可能原因与下一步</h2>
        <p>花上的访客也可能只是取食花粉。确认受害花和虫体同时出现，再针对害虫采取措施。</p>
