        <h1>缩叶病</h1>
        <p>新叶扭曲，局部发红</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="新叶扭曲，局部发红" src="../../images/leaf-b-twisted-red.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/746568019">照片来源</a> · (c) carnifex, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>检查多个枝尖的嫩叶，观察红色是正常新叶色还是伴随增厚起泡。</p>
        <h2>可能原因与下一步</h2>
        <p>某些病虫害会影响展开中的叶片。结合树种、季节及当地天气判断。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>嫩叶展开时可能因取食、受寒或病害而畸形。查看连续几片新叶是否都异常，以及有无红色隆起。</p>
        <h2>现在可以做什么</h2>
        <p>轻查折叠叶缘有无虫体，不要强行拉平；记录植物种类、萌芽时间和近期是否降温。</p>
        <h2>接下来观察什么</h2>
        <p>已卷曲的叶通常不会变平；若新梢也畸形，保留带一段嫩枝的新鲜样本。</p>
        <!-- /expanded guide -->
