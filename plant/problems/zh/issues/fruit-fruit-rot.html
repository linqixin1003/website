        <h1>果腐烂</h1>
        <p>果实变软腐烂</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="果实变软腐烂" src="../../images/fruit-rot-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/326326561">照片来源</a> · (c) Martin Hünlich, some rights reserved (CC BY-SA), uploaded by Martin Hünlich · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>检查软化是否从裂口、果柄或接触地面处开始。</p>
        <h2>可能原因与下一步</h2>
        <p>伤口和长时间潮湿会增加腐坏机会。移走明显腐败果，保持健康果清洁通风。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>轻触受损部位旁边。碰伤、受寒和腐烂都可能使组织塌软；软化范围持续扩大比固定凹痕更值得关注。</p>
        <h2>现在可以做什么</h2>
        <p>清走已脱落的腐烂组织，接触健康部位前清洁工具，避免健康组织接触腐烂处渗液。</p>
        <h2>接下来观察什么</h2>
        <p>跟踪软硬组织交界处；若软化蔓延到茎基或多株相继发生，应尽快鉴定。</p>
        <!-- /expanded guide -->
