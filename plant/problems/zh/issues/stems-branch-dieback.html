        <h1>枝枯病</h1>
        <p>部分枝条干枯死亡</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="部分枝条干枯死亡" src="../../images/stems-branch-dieback.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/455658902">照片来源</a> · (c) Alex Press, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>顺着枯枝向下寻找活组织，看看分界处是否有折痕、凹陷或绑带勒伤。</p>
        <h2>可能原因与下一步</h2>
        <p>局部损伤或枝条病害可造成单枝回枯。松开过紧绑带，标记边界；若扩大，拍摄整株及交界处求助。</p>
