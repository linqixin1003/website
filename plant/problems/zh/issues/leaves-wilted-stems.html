        <h1>枯梢</h1>
        <p>茎萎蔫</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="茎萎蔫" src="../../images/diagram-wilt.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>检查下垂的茎是否还有弹性，茎基是否折伤，以及根团内部的干湿。</p>
        <h2>可能原因与下一步</h2>
        <p>土太干或根部积水都会影响输水。根据实测湿度调整浇水，记录是否出现新的萎蔫枝条。</p>
