      <article class="article">
        <h1>黑斑病</h1>
        <p>细密的黑点</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="细密的黑点" src="../../images/leaf-a-black-specks.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/590307835">照片来源</a> · (c) Emerson, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>用放大镜观察黑点在叶面上还是组织内部，再看看叶背是否有细长小虫。</p>
        <h2>可能原因与下一步</h2>
        <p>若黑点嵌在枯死组织内，可能与叶斑病有关；若能擦去，可进一步排查虫粪。避免溅水，将病叶正反面和植物全貌一起拍下求证。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>用放大镜观察斑点。附着物可能擦掉，长在叶片组织中的坏死斑轻擦后仍在。</p>
        <h2>现在可以做什么</h2>
        <p>用湿白布轻擦一小块，对照叶片两面，再查相邻叶片以判断范围。</p>
        <h2>接下来观察什么</h2>
        <p>若小点融合成枯斑，或新叶也出现，保留一片完整样叶供进一步检查。</p>
        <!-- /expanded guide -->
