        <h1>水涝</h1>
        <p>叶缘发黑变软</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶缘发黑变软" src="../../images/leaf-b-black-margins.webp">
          <figcaption>这张晚疫病叶片照片用于对照发黑的叶缘。判断水涝还需检查盆土积水和排水情况。 <a href="https://www.inaturalist.org/photos/757704469">照片来源</a> · Michael Bomford · <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>确认黑边是干脆还是湿软，回顾是否碰到冷窗或受过低温。</p>
        <h2>可能原因与下一步</h2>
        <p>冷害与组织腐坏可能相似。避开寒风和湿叶接触，观察新损伤是否继续出现。</p>
