        <h1>白粉病</h1>
        <p>可擦去的白色粉层</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="可擦去的白色粉层" src="../../images/diagram-mildew.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察粉层是否呈不规则斑块，是否同时覆盖叶、嫩茎或果面。</p>
        <h2>可能原因与下一步</h2>
        <p>白粉病及表面残留物都有可能。记录是否再次出现，留足通风空间，结合寄主鉴别。</p>
