        <h1>炭疽病</h1>
        <p>灰斑带深色边缘</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="灰斑带深色边缘" src="../../images/diagram-grey-margin.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>比较斑点中央与边缘的颜色，看多个斑是否逐渐相连。</p>
        <h2>可能原因与下一步</h2>
        <p>多种叶斑有这种外观。浇水时减少溅水，留存病斑变化照片用于鉴别。</p>
