        <h1>蜗牛或蛞蝓</h1>
        <p>卷壳软体动物与黏液痕迹</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="卷壳软体动物与黏液痕迹" src="../../images/snail-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/767106059">照片来源</a> · no rights reserved · <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>在潮湿傍晚检查盆沿、叶下方及附近的遮蔽物。</p>
        <h2>可能原因与下一步</h2>
        <p>蜗牛取食可留下不规则缺口和黏液。清理花盆周边藏身处，观察新叶损伤是否减少。</p>
