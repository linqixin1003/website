      <article class="article">
        <h1>灰色霉</h1>
        <p>茎上出现灰褐色霉层</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="茎上出现灰褐色霉层" src="../../images/leaf-b-gray-mold.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:Tomate_St%C3%A4ngel_Botrytis.jpg">照片来源</a> · Goldlocki · <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>检查霉层是否从伤口、凋谢花或坏死组织附近开始，观察茎是否仍坚实。</p>
        <h2>可能原因与下一步</h2>
        <p>灰霉等问题容易出现在湿润环境。清理枯花枯叶，减少叶面水滴和枝条拥挤。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>找是否有绒毛直接从受损组织上长出。远看相似的泥点或灰尘，下面的组织可能仍很结实。</p>
        <h2>现在可以做什么</h2>
        <p>清除贴在受损处的残花和腐败组织，减少表面长时间潮湿，给拥挤枝梢留出通风空间。</p>
        <h2>接下来观察什么</h2>
        <p>若腐败向坚实组织或邻近果实蔓延，清理前拍下扩展边缘。</p>
        <!-- /expanded guide -->
