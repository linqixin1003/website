        <h1>茎腐烂</h1>
        <p>茎变软腐烂</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="茎变软腐烂" src="../../images/stems-stem-rot.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/410766245">照片来源</a> · (c) Bonnie Semmling, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察软化是否始于土面，组织是否变暗及凹陷，有没有折伤。</p>
        <h2>可能原因与下一步</h2>
        <p>长期潮湿的基部容易受损。移去贴住茎的湿覆盖物，避免水滞留在茎基，检查根系。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>轻触受损部位旁边。碰伤、受寒和腐烂都可能使组织塌软；软化范围持续扩大比固定凹痕更值得关注。</p>
        <h2>现在可以做什么</h2>
        <p>清走已脱落的腐烂组织，接触健康部位前清洁工具，避免健康组织接触腐烂处渗液。</p>
        <h2>接下来观察什么</h2>
        <p>跟踪软硬组织交界处；若软化蔓延到茎基或多株相继发生，应尽快鉴定。</p>
        <!-- /expanded guide -->
