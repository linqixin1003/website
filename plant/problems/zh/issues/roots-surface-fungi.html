        <h1>土壤发霉</h1>
        <p>土壤表面出现真菌或蘑菇</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="土壤表面出现真菌或蘑菇" src="../../images/soil-mushrooms.webp">
          <figcaption>参考照片 · <a href="https://commons.wikimedia.org/wiki/File:Aborting_Leucocoprinus_birnbaumii.jpg">Aborting Leucocoprinus birnbaumii.jpg</a> · Axelradical · <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a> · 已缩放并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>留意生长物仅在土面，还是也延伸到根颈。观察新叶是否仍然挺立。</p>
        <h2>可能原因与下一步</h2>
        <p>土中分解有机质的真菌也会长出蘑菇。清理枯叶，检查盆土是否长期潮湿；若根颈也发软，进一步检查根。</p>
