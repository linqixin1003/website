        <h1>叶腐烂</h1>
        <p>叶片发软腐烂</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶片发软腐烂" src="../../images/diagram-leaf-rot.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>查看受害叶是否贴土或贴着湿叶，是否有水渍状边缘。</p>
        <h2>可能原因与下一步</h2>
        <p>清除已经腐烂的组织，浇水时避开叶片，检查叶柄基部是否同样受损。</p>
