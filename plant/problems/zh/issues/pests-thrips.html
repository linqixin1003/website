        <h1>蓟马</h1>
        <p>花和嫩叶上的细长小虫</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="花和嫩叶上的细长小虫" src="../../images/thrips-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/618528210">照片来源</a> · (c) nmoorhatch, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>将花轻轻敲在白纸上，用放大镜查看细长小虫，并留意花瓣的刮擦状斑纹。</p>
        <h2>可能原因与下一步</h2>
        <p>蓟马可能藏在花蕾。隔离明显受害的盆栽，同时检查新开放花朵。</p>
