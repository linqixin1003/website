        <h1>黑斑病</h1>
        <p>叶片上出现黑色斑块</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶片上出现黑色斑块" src="../../images/leaf-a-black-spots.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/400720419">照片来源</a> · (c) Bohan Jia, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>查看黑色病斑是否长在叶组织内、周围是否发黄，并检查较低叶片有无提前脱落。</p>
        <h2>可能原因与下一步</h2>
        <p>玫瑰黑斑病可形成深色病斑并使叶片脱落；能擦去的黑层则可能是煤污。清理病落叶，从根部浇水，给叶丛留出通风空间。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>先区分叶内黑斑和表面黑污。煤污状附着物可沾到湿布上，坏死组织则擦不掉。</p>
        <h2>现在可以做什么</h2>
        <p>清走植株下方的落叶；拍照时同时记录刚形成的斑和已扩大的斑。</p>
        <h2>接下来观察什么</h2>
        <p>若受损叶迅速脱落，先确认植物种类，再结合蔓延方式寻求诊断。</p>
