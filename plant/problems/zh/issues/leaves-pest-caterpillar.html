        <h1>毛毛虫</h1>
        <p>短足、身体分节的幼虫</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="短足、身体分节的幼虫" src="../../images/caterpillar-nat.webp">
          <figcaption>参考照片 · <a href="https://www.inaturalist.org/photos/765009496">Pieris rapae</a> · (c) reagan peschke, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已缩放并转为 WebP</figcaption>

        <h2>先看哪里</h2>
        <p>沿着新鲜咬孔寻找幼虫，检查叶片折叠处和枝条背面。</p>
        <h2>可能原因与下一步</h2>
        <p>记录受害范围和虫体特征。少量取食往往不影响健壮植株，观察新叶再决定是否干预。</p>
