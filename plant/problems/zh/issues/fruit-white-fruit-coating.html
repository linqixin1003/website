        <h1>白粉病</h1>
        <p>果面有白色粉状覆盖物</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="果面有白色粉状覆盖物" src="../../images/organs-fruit-white-fruit-coating.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:UncinulaNecatorOnGrapes.jpg">照片来源</a> · Oliver Macdonald (Maccheek) · <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>留意粉层分布及同株叶片，区分品种天然果粉与新出现的不均匀白斑。</p>
        <h2>可能原因与下一步</h2>
        <p>某些真菌病害也会产生白粉。避免擦伤果皮，记录是否蔓延到叶和新果。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>天然果粉或蜡层往往较均匀；粉状病斑则常呈不规则块，并可能扩大或出现在新组织上。</p>
        <h2>现在可以做什么</h2>
        <p>对照同株健康与受损部位；触碰前先拍下覆盖层，保留健康果实上的天然果粉。</p>
        <h2>接下来观察什么</h2>
        <p>若新粉斑扩展到嫩梢或叶片，结合植物种类进一步判断是否需要处理。</p>
        <!-- /expanded guide -->
