        <h1>粉蚧</h1>
        <p>叶腋有白色棉絮状小虫</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶腋有白色棉絮状小虫" src="../../images/mealybug-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/767077112">照片来源</a> · (c) Victor Heng, some rights reserved (CC BY-SA) · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>仔细查看叶柄连接处，寻找蜡絮覆盖的虫体及附近的蜜露。</p>
        <h2>可能原因与下一步</h2>
        <p>这些特征可提示粉蚧。隔开植株，小范围虫体可用湿布擦去，再检查新生部位。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>粉蚧常藏在叶腋；若绒状物下找不到分节虫体，也要考虑其他原因。</p>
        <h2>现在可以做什么</h2>
        <p>把盆栽移开，避免与邻株枝叶接触；检查叶腋和盆沿，用湿棉签轻轻移走小群虫体。</p>
        <h2>接下来观察什么</h2>
        <p>复查原先干净的嫩枝；那里新出现的棉絮状虫团，比旧位置残留的蜡质更能说明问题。</p>
        <!-- /expanded guide -->
