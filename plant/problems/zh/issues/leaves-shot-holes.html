        <h1>细菌性穿孔</h1>
        <p>褐斑中心脱落成孔</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="褐斑中心脱落成孔" src="../../images/diagram-shot-hole.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察新旧斑点，看看孔边是否留有一圈褐色组织。</p>
        <h2>可能原因与下一步</h2>
        <p>坏死组织脱落可形成穿孔，和直接啃食不同。收集斑点到穿孔的照片以便鉴别。</p>
