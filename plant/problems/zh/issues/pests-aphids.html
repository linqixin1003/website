        <h1>害虫-蚜虫</h1>
        <p>梨形小虫聚集在新梢上</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="梨形小虫聚集在新梢上" src="../../images/aphids-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/766539823">照片来源</a> · (c) Robin White, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>查看嫩梢和花蕾周围是否有成群的小虫、蜕皮及发黏的叶片。</p>
        <h2>可能原因与下一步</h2>
        <p>这些迹象符合蚜虫取食。小范围可用清水轻冲，观察是否已有瓢虫等天敌来访。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>嫩梢上成群的小虫、白色蜕皮和黏叶常同时出现。若只剩空蜕皮，活虫可能已离开。</p>
        <h2>现在可以做什么</h2>
        <p>托住较结实的枝梢，轻轻冲洗顶端和叶背，再查看邻株新梢。</p>
        <h2>接下来观察什么</h2>
        <p>重点查看刚展开的新叶是否有活虫；即使已经没有蚜虫，原先的卷叶也可能维持原状。</p>
        <!-- /expanded guide -->
