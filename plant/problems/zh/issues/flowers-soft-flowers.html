        <h1>花腐烂</h1>
        <p>花朵变软腐烂</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="花朵变软腐烂" src="../../images/diagram-flower-rot.webp">
          <figcaption>症状示意 · Plant guide editorial illustrations</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>轻看花瓣交叠处是否水渍状，比较刚开的花和老花。</p>
        <h2>可能原因与下一步</h2>
        <p>持续潮湿会使受伤花瓣容易腐败。摘下烂花，保持花间通风，浇水时避开花冠。</p>
