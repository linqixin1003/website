        <h1>缺铁</h1>
        <p>叶肉黄而叶脉绿</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶肉黄而叶脉绿" src="../../images/leaf-a-interveinal.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/392097921">照片来源</a> · no rights reserved · <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察叶脉间失绿是先发生在新叶还是老叶，拍下叶片正面。</p>
        <h2>可能原因与下一步</h2>
        <p>营养吸收受阻可能与根损伤或基质酸碱度有关。结合植物种类和土壤检测再调整施肥。</p>
