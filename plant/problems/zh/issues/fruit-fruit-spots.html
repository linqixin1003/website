        <h1>果斑纹</h1>
        <p>果面出现黑褐色斑纹</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="果面出现黑褐色斑纹" src="../../images/organs-fruit-fruit-spots.webp">
          <figcaption><a href="https://commons.wikimedia.org/wiki/File:Apple_scab_2017_B.jpg">照片来源</a> · Fructibus · <a href="https://creativecommons.org/publicdomain/zero/1.0/deed.en">CC0</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>比较斑纹位置、是否凹陷，以及同株其他果实的情况。</p>
        <h2>可能原因与下一步</h2>
        <p>摩擦、日灼和病斑都可能变暗。标记有斑果实并观察是否扩大，避免挤伤健康果。</p>
