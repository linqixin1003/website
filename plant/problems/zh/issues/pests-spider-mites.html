        <h1>害虫-叶螨</h1>
        <p>叶背有细小螨和细丝</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="叶背有细小螨和细丝" src="../../images/spider-mite-nat.webp">
          <figcaption>参考照片 · <a href="https://www.inaturalist.org/photos/1696964">Tetranychus urticae</a> · (c) Gilles San Martin, some rights reserved (CC BY-SA) · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA</a> · 已缩放并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>观察叶背是否有细丝、活动的小点和叶面失绿斑。</p>
        <h2>可能原因与下一步</h2>
        <p>螨类取食可造成细碎失绿。用清水冲洗适合水洗的叶面，隔开受害盆栽以便复查。</p>
