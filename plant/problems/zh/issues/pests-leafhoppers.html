        <h1>叶蝉</h1>
        <p>善跳的楔形小虫</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="善跳的楔形小虫" src="../../images/leafhopper-nat.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/766434013">照片来源</a> · (c) Stephan Mende, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>轻碰叶片，观察虫体是否侧跳；拍摄背部外形及叶上褪色区。</p>
        <h2>可能原因与下一步</h2>
        <p>叶蝉取食有时会造成失绿。偶然停留的虫体不能说明全部症状，需对照新梢变化。</p>
