        <h1>褐斑病</h1>
        <p>褐斑带有黄色边缘</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="褐斑带有黄色边缘" src="../../images/leaf-a-yellow-halo.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/188434842">照片来源</a> · (c) Alan Rockefeller, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>留意黄色是否只环绕褐斑，湿润时斑块有无水渍状边缘。</p>
        <h2>可能原因与下一步</h2>
        <p>某些叶斑病会有黄晕。改从土面浇水，避免湿叶相互摩擦，观察新的斑块是否增加。</p>
