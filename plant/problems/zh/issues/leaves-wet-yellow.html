        <h1>水涝</h1>
        <p>湿土中的下叶成片发黄</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="湿土中的下叶成片发黄" src="../../images/leaf-a-wet-yellow.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/763135029">照片来源</a> · (c) Luca Gagliano, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <p>照片用于对照黄叶外观。请结合盆土湿度判断原因。</p>
        <h2>先看哪里</h2>
        <p>看看表土以下是否持续湿黏、套盆是否积水，同时比较顶部新叶。</p>
        <h2>可能原因与下一步</h2>
        <p>根部缺氧会影响叶色。倒掉积水，在重新浇水前按植物习性检查干湿。</p>

        <!-- expanded guide -->
        <h2>怎样区分相似问题</h2>
        <p>表土干燥时盆心仍可能很湿。先检查根层湿度，再掂一掂盆重后决定是否浇水。</p>
        <h2>现在可以做什么</h2>
        <p>根团干透时均匀润湿并充分沥水；若根团湿，先倒掉积水，检查排水孔。</p>
        <h2>接下来观察什么</h2>
        <p>观察枝叶能否恢复挺立，以及新生长是否健康。湿土中仍萎蔫时先检查根团。</p>
