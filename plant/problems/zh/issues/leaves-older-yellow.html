        <h1>正常枯黄</h1>
        <p>少量老叶逐渐发黄</p>
        <p>这是与该表现相符的一种可能原因，请结合下方特征核对。</p>
        <figure><img alt="少量老叶逐渐发黄" src="../../images/leaf-a-older-yellow.webp">
          <figcaption><a href="https://www.inaturalist.org/photos/766002064">照片来源</a> · (c) Bryce Watts-Parker, some rights reserved (CC BY) · <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY</a> · 已调整尺寸并转为 WebP</figcaption>
        </figure>
        <h2>先看哪里</h2>
        <p>标记变黄的叶片，记录它们是否都是最老的下叶。</p>
        <h2>可能原因与下一步</h2>
        <p>枝条仍在健康生长且只更替少量老叶时，可先观察。若新叶也黄，检查根部及供水。</p>
