        <a class="item" href="issues/flowers-dry-flowers.html"><img src="../images/organs-flowers-dry-flowers.webp" alt="" loading="lazy"><div class="item-copy"><span>花朵干枯</span><small>枯萎是否只发生在已经开放很久的花？看花蕾及同一枝条的叶片是否健康。</small></div></a>

        <a class="item" href="issues/flowers-weevils.html"><img src="../images/organs-flowers-weevils.webp" alt="" loading="lazy"><div class="item-copy"><span>花蕾附近有长吻甲虫，未开的花蕾下垂</span><small>托起下垂但尚未开放的花蕾，看花蕾下方的短梗是否有切痕，再检查旁边花蕾上是否有带长吻的小甲虫。</small></div></a>
